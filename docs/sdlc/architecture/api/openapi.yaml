      operationId: get_audit_log
      parameters: []
      responses:
        '200':
          description: '{entries[]}'
      security:
      - bearerAuth: []
  /auth/login:
    post:
      summary: Authenticate with email/password; returns JWT and role. Generic error
        on failure.
      description: Authenticate with email/password; returns JWT and role. Generic
        error on failure.
      operationId: post_auth_login
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{email, password}'
      responses:
        '200':
          description: '{access_token, role}'
  /auth/logout:
    post:
      summary: End the current session.
      description: End the current session.
      operationId: post_auth_logout
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{}'
      responses:
        '200':
          description: '204'
      security:
      - bearerAuth: []
  /auth/password-reset/confirm:
    post:
      summary: Set a new password with a valid, unused, unexpired token.
      description: Set a new password with a valid, unused, unexpired token.
      operationId: post_auth_password_reset_confirm
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{token, new_password}'
      responses:
        '200':
          description: 200 or 400 rejected
  /auth/password-reset/request:
    post:
      summary: Send a time-limited reset link to a registered email.
      description: Send a time-limited reset link to a registered email.
      operationId: post_auth_password_reset_request
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{email}'
      responses:
        '200':
          description: 202 accepted
  /dashboard/me:
    get:
      summary: Personal goal dashboard with progress, due dates and flags; cached
        aggregate.
      description: Personal goal dashboard with progress, due dates and flags; cached
        aggregate.
      operationId: get_dashboard_me
      parameters: []
      responses:
        '200':
          description: '{summary, goals[]}'
      security:
      - bearerAuth: []
  /dashboard/team:
    get:
      summary: Manager team view of direct reports' goals and progress; cached aggregate.
      description: Manager team view of direct reports' goals and progress; cached
        aggregate.
      operationId: get_dashboard_team
      parameters: []
      responses:
        '200':
          description: '{reports[]}'
      security:
      - bearerAuth: []
  /employees:
    post:
      summary: HR admin creates an employee record (name, email, role).
      description: HR admin creates an employee record (name, email, role).
      operationId: post_employees
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{name, email, role}'
      responses:
        '200':
          description: '{employee}'
      security:
      - bearerAuth: []
  /employees/{id}:
    put:
      summary: HR admin edits an employee record.
      description: HR admin edits an employee record.
      operationId: put_employees_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{name?, email?, role?}'
      responses:
        '200':
          description: '{employee}'
      security:
      - bearerAuth: []
  /employees/{id}/deactivate:
    post:
      summary: Deactivate an employee so they can no longer log in while keeping history.
      description: Deactivate an employee so they can no longer log in while keeping
        history.
      operationId: post_employees_id_deactivate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{}'
      responses:
        '200':
          description: '{employee}'
      security:
      - bearerAuth: []
  /employees/{id}/export:
    get:
      summary: Export an individual's personal and performance data to a file.
      description: Export an individual's personal and performance data to a file.
      operationId: get_employees_id_export
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: file (JSON/CSV)
      security:
      - bearerAuth: []
  /employees/{id}/manager:
    put:
      summary: Set or reassign an employee's manager, rejecting cycles.
      description: Set or reassign an employee's manager, rejecting cycles.
      operationId: put_employees_id_manager
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{manager_id}'
      responses:
        '200':
          description: '{employee} or 400 cycle'
      security:
      - bearerAuth: []
  /employees/{id}/personal-data:
    delete:
      summary: Delete/anonymise identifying data on an approved request; writes audit
        entry.
      description: Delete/anonymise identifying data on an approved request; writes
        audit entry.
      operationId: delete_employees_id_personal_data
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: '204'
      security:
      - bearerAuth: []
  /goals:
    get:
      summary: List goals visible to the caller per role and reporting line.
      description: List goals visible to the caller per role and reporting line.
      operationId: get_goals
      parameters: []
      responses:
        '200':
          description: '{goals[]}'
      security:
      - bearerAuth: []
    post:
      summary: Create a goal (self or, for managers, a direct report); optional parent
        objective.
      description: Create a goal (self or, for managers, a direct report); optional
        parent objective.
      operationId: post_goals
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{title, description, target_metric, due_date, progress_type,
                owner_id?, parent_objective_id?}'
      responses:
        '200':
          description: '{goal}'
      security:
      - bearerAuth: []
  /goals/{id}:
    put:
      summary: Edit a goal's details or link/unlink a parent objective.
      description: Edit a goal's details or link/unlink a parent objective.
      operationId: put_goals_id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{title?, description?, target_metric?, due_date?, parent_objective_id?}'
      responses:
        '200':
          description: '{goal}'
      security:
      - bearerAuth: []
  /goals/{id}/check-ins:
