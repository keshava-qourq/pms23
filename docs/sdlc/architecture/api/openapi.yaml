          description: '{notifications[]}'
      security:
      - bearerAuth: []
  /notifications/{id}/read:
    patch:
      summary: Mark/dismiss an in-app notification as read.
      description: Mark/dismiss an in-app notification as read.
      operationId: patch_notifications_id_read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{}'
      responses:
        '200':
          description: '204'
      security:
      - bearerAuth: []
  /objectives:
    get:
      summary: List higher-level objectives available to cascade from.
      description: List higher-level objectives available to cascade from.
      operationId: get_objectives
      parameters: []
      responses:
        '200':
