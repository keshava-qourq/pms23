      description: Update progress by percentage (0-100) or status; marks complete
        at 100%/Completed.
      operationId: patch_goals_id_progress
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{progress_percent?, status?}'
      responses:
        '200':
          description: '{goal}'
      security:
      - bearerAuth: []
  /notifications:
