      - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    users:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        password_hash:
          type: string
        role:
          type: string
        manager_id:
          type: string
          format: uuid
        is_active:
          type: boolean
        anonymised_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - email
      - role
      - is_active
      - created_at
      - updated_at
    objectives:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        level:
          type: string
        owner_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
      required:
      - id
      - title
      - level
      - created_at
    goals:
      type: object
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        parent_objective_id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        target_metric:
          type: string
        progress_type:
          type: string
        progress_percent:
          type: integer
        status:
          type: string
        check_in_interval_days:
          type: integer
        due_date:
          type: string
          format: date
        completed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - owner_id
      - created_by
      - title
      - progress_type
      - due_date
      - created_at
      - updated_at
    check_ins:
      type: object
      properties:
        id:
          type: string
          format: uuid
        goal_id:
          type: string
          format: uuid
        author_id:
          type: string
          format: uuid
        note:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - goal_id
      - author_id
      - note
      - created_at
    praise:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sender_id:
          type: string
          format: uuid
        recipient_id:
          type: string
          format: uuid
        message:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - sender_id
      - recipient_id
      - message
      - created_at
    notifications:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        type:
          type: string
        message:
          type: string
        is_read:
          type: boolean
        email_status:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - type
      - message
      - is_read
      - created_at
    password_reset_tokens:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        token_hash:
          type: string
        expires_at:
          type: string
          format: date-time
        used_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - token_hash
      - expires_at
      - created_at
    audit_log:
      type: object
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        entity_type:
          type: string
        entity_id:
          type: string
          format: uuid
        action:
          type: string
        changes:
          type: string
        created_at:
          type: string
          format: date-time
      required:
      - id
      - entity_type
      - action
      - created_at
