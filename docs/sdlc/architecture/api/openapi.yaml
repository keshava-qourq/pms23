      summary: Add a dated check-in note to a goal.
      description: Add a dated check-in note to a goal.
      operationId: post_goals_id_check_ins
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: '{note}'
      responses:
        '200':
          description: '{check_in}'
      security:
      - bearerAuth: []
  /goals/{id}/progress:
    patch:
      summary: Update progress by percentage (0-100) or status; marks complete at
